<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800, initial-scale=1.0, user-scalable=no">
    <title>Scout Inventory Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="header">
            <h1>Scout Inventory</h1>
            <div id="last-update" class="update-time">Loading...</div>
        </header>

        <!-- Service Grid -->
        <main class="services-grid">
            <!-- Web API Service -->
            <div class="service-card">
                <div class="service-title">API Server</div>
                <div class="status-display" id="web-status">
                    <div class="status-dot"></div>
                    <div class="status-label">Checking...</div>
                </div>
                <div class="service-details" id="web-info">
                    <div class="detail-item">
                        <span id="web-state">-</span>
                    </div>
                </div>
                <button class="restart-button" id="restart-web" onclick="restartService('web')">
                    RESTART
                </button>
            </div>

            <!-- Database Service -->
            <div class="service-card">
                <div class="service-title">Database</div>
                <div class="status-display" id="db-status">
                    <div class="status-dot"></div>
                    <div class="status-label">Checking...</div>
                </div>
                <div class="service-details" id="db-info">
                    <div class="detail-item">
                        <span id="db-state">-</span>
                    </div>
                </div>
                <button class="restart-button" id="restart-db" onclick="restartService('database')">
                    RESTART
                </button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-item">
                <span class="label">Web:</span>
                <span class="value">{{ web_container }}</span>
            </div>
            <div class="footer-item">
                <span class="label">DB:</span>
                <span class="value">{{ db_container }}</span>
            </div>
        </footer>

        <!-- Notification Toast -->
        <div id="notification" class="notification"></div>
    </div>

    <script>
        const REFRESH_INTERVAL = {{ refresh_interval }};
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
